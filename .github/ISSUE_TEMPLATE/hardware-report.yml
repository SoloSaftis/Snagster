name: Hardware report
description: Tell us how Snagster's graphics-chip recording and streaming work on your computer.
title: "Hardware report: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Snagster records and streams with the graphics chip (Intel Quick Sync, NVIDIA NVENC,
        AMD AMF, Apple VideoToolbox, Linux VA-API). Our test machines have no graphics chips, so your
        report shows us whether it really works on yours.

        Run the hardware test (it builds Snagster, then tests the encoders and streams into
        Snagster's own server on your computer; nothing is sent anywhere):
        - **Windows:** `powershell -ExecutionPolicy Bypass -c "irm https://raw.githubusercontent.com/SoloSaftis/Snagster/main/scripts/hwtest.ps1 | iex"`
          (or `-Exe C:\path\Snagster.exe` to test a downloaded Snagster without building)
        - **macOS / Linux:** `curl -fsSL https://raw.githubusercontent.com/SoloSaftis/Snagster/main/scripts/hwtest.sh | bash`
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics chip
      placeholder: e.g. NVIDIA RTX 3060, AMD Radeon 780M, Apple M2, Intel Arc A380
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: hwtest-report.txt
      description: Paste the whole file the script wrote.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Did a real recording or stream look right? Anything odd?
