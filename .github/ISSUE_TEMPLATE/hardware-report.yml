name: Hardware report
description: Tell us how Snagster's graphics-chip recording and streaming work on your computer.
title: "Hardware report: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Snagster records and streams with the graphics chip (Intel Quick Sync, NVIDIA NVENC,
        AMD AMF, Apple VideoToolbox, Linux VA-API and NVENC). Your report shows us whether it really
        works on yours.

        One command tests everything and writes `snagster-hw-report.txt`: your system and graphics
        chips, every video encoder, and a few seconds of recording and streaming into a small server
        inside Snagster. Nothing is sent anywhere. Run it in the folder where Snagster is:
        - **Windows** (PowerShell): `Start-Process .\Snagster.exe --hw-report -Wait`
        - **Mac:** `/Applications/Snagster.app/Contents/MacOS/Snagster --hw-report`
        - **Linux:** `./Snagster-linux-x86_64.AppImage --hw-report`

        Then drag `snagster-hw-report.txt` into the box below, or paste what it says.
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics chip
      placeholder: e.g. NVIDIA RTX 3060, AMD Radeon 780M, Apple M2, Intel Arc A380
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: snagster-hw-report.txt
      description: Drag the file in, or paste it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Did a real recording or stream look right? Anything odd?