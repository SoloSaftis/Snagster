name: Hardware report
description: Tell us how Snagster's graphics-chip recording and streaming work on your computer.
title: "Hardware report: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Snagster records and streams with the graphics chip (Intel Quick Sync, NVIDIA NVENC,
        AMD AMF, Apple VideoToolbox, Linux VA-API). Your report shows us whether it really works on yours.

        Snagster has the tests built in. They record a few seconds of your screen into a temporary
        file and stream into a small server inside Snagster on your computer; nothing is sent anywhere.
        Run both in the folder where Snagster is, then paste the two files below:
        - **Windows** (PowerShell):
          `Start-Process .\Snagster.exe '--video-test quick' -Wait -NoNewWindow -RedirectStandardOutput video-test.txt`
          and `Start-Process .\Snagster.exe '--stream-test quick' -Wait -NoNewWindow -RedirectStandardOutput stream-test.txt`
        - **Mac:** `/Applications/Snagster.app/Contents/MacOS/Snagster --video-test quick > video-test.txt 2>&1`
          and the same with `--stream-test quick > stream-test.txt`
        - **Linux:** `./Snagster-linux-x86_64.AppImage --video-test quick > video-test.txt 2>&1`
          and the same with `--stream-test quick > stream-test.txt`
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics chip
      placeholder: e.g. NVIDIA RTX 3060, AMD Radeon 780M, Apple M2, Intel Arc A380
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: video-test.txt
      description: Paste the whole file.
      render: text
    validations:
      required: true
  - type: textarea
    id: stream
    attributes:
      label: stream-test.txt
      description: Paste the whole file.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Did a real recording or stream look right? Anything odd?