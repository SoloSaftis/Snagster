# Builds and tests Windows, Linux and macOS on every push to any branch; a warning fails the build
# on every system. Pushing a tag like v0.7.0 also publishes a GitHub release with the fixed file
# names the README's download links point to.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older run (main and tags always finish).
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Zero warnings on every system, not just the one the change was made on.
  RUSTFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every language pack translates every text
        run: node assets/i18n/check.js
      - name: The MCP smoke test script parses
        run: node --check tests/mcp-smoke.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A new cache since NASM is installed: OpenH264 built without its assembly isn't reused.
          prefix-key: v1-nasm
      - name: NASM (OpenH264's x86 assembly; without it OpenH264 is built in plain C)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster.exe
      - name: Button test (every button in the real window)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The CI machine has no graphics driver (OpenGL 1.1 only), so the test copy gets Mesa's
          # software OpenGL beside it: a pinned release, checked against its published checksum.
          # The shipped zip doesn't include it; real computers use their own driver.
          $mesa = "mesa3d-26.2.6-release-mingw.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/$mesa" -OutFile $mesa
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash -ne "DA0F71D9181B672C1918F3C342F11118C687F6059A46B16502845160733CC388") { throw "Mesa checksum differs" }
          7z x $mesa -omesa -y | Out-Null
          New-Item -ItemType Directory -Force uitest | Out-Null
          Copy-Item target/release/snagster.exe uitest/
          $gl = Get-ChildItem mesa -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -notmatch 'x86' } | Select-Object -First 1
          if (-not $gl) {
            Get-ChildItem mesa -Recurse -Filter *.dll | ForEach-Object { $_.FullName }
            throw "Mesa's opengl32.dll is missing"
          }
          Write-Host "OpenGL from $($gl.DirectoryName)"
          Copy-Item "$($gl.DirectoryName)/*.dll" uitest/
          Get-ChildItem uitest | Format-Table Name, Length
          $env:GALLIUM_DRIVER = "llvmpipe"
          # The release build is a windowed program: wait for it and collect what it prints.
          Start-Process uitest/snagster.exe -ArgumentList '--ui-test' -Wait -NoNewWindow -RedirectStandardOutput ui-test.txt
          Get-Content ui-test.txt
          if (-not (Select-String -Path ui-test.txt -Pattern '^(\d+) of \1 button actions worked' -Quiet)) { exit 1 }
      - name: Stream test (the screen into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        shell: pwsh
        run: |
          Start-Process target/release/snagster.exe -ArgumentList '--stream-test','quick' -Wait -NoNewWindow -RedirectStandardOutput stream-test.txt
          Get-Content stream-test.txt
          if (-not (Select-String -Path stream-test.txt -Pattern '^stream test: all passed' -Quiet)) { exit 1 }
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $dir = "dist/Snagster"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/snagster.exe "$dir/Snagster.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath dist/Snagster-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Snagster-windows-x64-portable.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A new cache since NASM is installed: OpenH264 built without its assembly isn't reused.
          prefix-key: v1-nasm
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libdbus-1-dev libfuse2 \
            libva2 libva-drm2 \
            nasm
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster
      - name: Button test on a virtual screen (every button must work on Linux too)
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/snagster --ui-test | tee ui-test.txt
          grep -qE "^([0-9]+) of \1 button actions worked" ui-test.txt
      - name: Stream test on the virtual screen (into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/snagster --stream-test quick | tee stream-test.txt
          grep -q "^stream test: all passed" stream-test.txt
      - name: Package (AppImage and portable tar.gz)
        run: |
          set -euo pipefail
          stage=dist/Snagster
          mkdir -p "$stage"
          cp target/release/snagster "$stage/Snagster"
          cp assets/snagster-256.png "$stage/snagster.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          cat > "$stage/snagster.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Snagster
          Comment=Capture your screen, mark it up, share it
          Exec=Snagster
          Icon=snagster
          Categories=Graphics;Utility;
          DESKTOP
          tar -C dist -czf dist/Snagster-linux-x86_64-portable.tar.gz Snagster
          appdir=dist/Snagster.AppDir
          mkdir -p "$appdir/usr/bin"
          cp target/release/snagster "$appdir/usr/bin/Snagster"
          cp assets/snagster-256.png "$appdir/snagster.png"
          cp "$stage/snagster.desktop" "$appdir/snagster.desktop"
          printf '#!/bin/sh\nhere="$(dirname "$(readlink -f "$0")")"\nexec "$here/usr/bin/Snagster" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          # appimagetool, pinned to a release and checked against its published checksum.
          tool=dist/appimagetool
          curl -fsSL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --no-appstream "$appdir" dist/Snagster-linux-x86_64.AppImage
      - name: The packaged AppImage and tar.gz start
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Snagster-linux-x86_64.AppImage help | sed -n 1,5p
          mkdir -p /tmp/tgz && tar -C /tmp/tgz -xzf dist/Snagster-linux-x86_64-portable.tar.gz
          /tmp/tgz/Snagster/Snagster help | sed -n 1,5p
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Snagster-linux-x86_64.AppImage
            dist/Snagster-linux-x86_64-portable.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster
      - name: Button test (every button in the real window; the runner has a logged-in desktop)
        timeout-minutes: 10
        run: |
          ./target/release/snagster --ui-test | tee ui-test.txt
          grep -qE "^([0-9]+) of \1 button actions worked" ui-test.txt
      # Apple silicon: OpenH264 uses its NEON assembly, so no NASM. Without the screen-recording
      # permission the test streams a moving test picture instead of the screen.
      - name: Stream test (into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        run: |
          set -o pipefail
          ./target/release/snagster --stream-test quick | tee stream-test.txt
          grep -q "^stream test: all passed" stream-test.txt
      - name: Package (app in a zip)
        run: |
          set -euo pipefail
          app=dist/Snagster.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/snagster "$app/MacOS/snagster"
          iconset=dist/snagster.iconset
          mkdir -p "$iconset"
          for s in 16 32 64 128 256; do sips -z $s $s assets/snagster-256.png --out "$iconset/icon_${s}x${s}.png" >/dev/null; done
          cp "$iconset/icon_32x32.png" "$iconset/icon_16x16@2x.png"
          cp "$iconset/icon_64x64.png" "$iconset/icon_32x32@2x.png"
          cp "$iconset/icon_256x256.png" "$iconset/icon_128x128@2x.png"
          rm "$iconset/icon_64x64.png"
          iconutil -c icns "$iconset" -o "$app/Resources/Snagster.icns"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Snagster</string>
            <key>CFBundleDisplayName</key><string>Snagster</string>
            <key>CFBundleIdentifier</key><string>app.snagster</string>
            <key>CFBundleExecutable</key><string>snagster</string>
            <key>CFBundleIconFile</key><string>Snagster</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSScreenCaptureUsageDescription</key><string>Snagster takes screenshots of what you choose.</string>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - dist/Snagster.app
          (cd dist && ditto -c -k --keepParent Snagster.app Snagster-macos-arm64.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Snagster-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/__TAG__/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          gh release create "${GITHUB_REF_NAME}" artifacts/* --title "Snagster ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes --latest
