name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: snagster-windows-x64
            bin: snagster.exe
          - os: ubuntu-latest
            name: snagster-linux-x64
            bin: snagster
          - os: macos-latest
            name: snagster-macos-arm64
            bin: snagster
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libdbus-1-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          cp README.md dist/

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: |
          APP=dist/Snagster.app/Contents
          mkdir -p "$APP/MacOS"
          cp target/release/snagster "$APP/MacOS/snagster"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Snagster</string>
            <key>CFBundleIdentifier</key><string>app.snagster</string>
            <key>CFBundleExecutable</key><string>snagster</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSScreenCaptureUsageDescription</key><string>Snagster takes screenshots of what you choose.</string>
          </dict></plist>
          EOF
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../${d%/}.zip" .); done
          gh release create "${GITHUB_REF_NAME}" *.zip --repo "${GITHUB_REPOSITORY}" --title "Snagster ${GITHUB_REF_NAME}" --generate-notes
