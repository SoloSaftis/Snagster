# Builds and tests Windows, Linux and macOS on every push to any branch; a warning fails the build
# on every system. Pushing a tag like v0.7.0 also publishes a GitHub release with the fixed file
# names the README's download links point to.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older run (main and tags always finish).
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Zero warnings on every system, not just the one the change was made on.
  RUSTFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every language pack translates every text
        run: node assets/i18n/check.js
      - name: The MCP smoke test script parses
        run: node --check tests/mcp-smoke.js
      - name: MCP bundles and server.json (the MCP Registry listing) are made right
        run: node packaging/mcpb/make-mcpb.js self-test
      # Here, on the newest Ubuntu: the store listing uses AppStream tags (developer, vcs-browser)
      # that the validator on the Linux build job's older Ubuntu doesn't know yet.
      - name: Linux menu entry and store listing are valid (what Flathub checks)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends desktop-file-utils appstream
          desktop-file-validate assets/linux/io.github.SoloSaftis.Snagster.desktop
          appstreamcli validate --no-net --explain assets/linux/io.github.SoloSaftis.Snagster.metainfo.xml

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      # Azure Artifact Signing logs in with GitHub's OpenID Connect token (no stored password).
      id-token: write
    env:
      # Signing with Azure Artifact Signing once it is set up (packaging/msix/README.md):
      # Snagster.exe in both downloads and the MSIX. Until then the MSIX is signed with a
      # throwaway test certificate and isn't released, and the exe is unsigned as before.
      # Only main and release tags sign (the Azure login trusts those refs, not every branch).
      SIGNED: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' && secrets.AZURE_CLIENT_ID != '' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A new cache since NASM is installed: OpenH264 built without its assembly isn't reused.
          prefix-key: v1-nasm
      - name: NASM (OpenH264's x86 assembly; without it OpenH264 is built in plain C)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster.exe
      - name: Button test (every button in the real window, drawn with Direct3D 12)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # The CI machine has no graphics driver: Direct3D 12 runs on Microsoft's WARP software
          # renderer, like a Remote Desktop or VDI session on a company laptop.
          Start-Process target/release/snagster.exe -ArgumentList '--ui-test' -Wait -NoNewWindow -RedirectStandardOutput ui-test-d3d.txt
          Get-Content ui-test-d3d.txt
          if (-not (Select-String -Path ui-test-d3d.txt -Pattern '^(\d+) of \1 button actions worked' -Quiet)) { exit 1 }
          if (-not (Select-String -Path ui-test-d3d.txt -Pattern '^Drawn with Direct3D 12 on' -Quiet)) { throw "the window wasn't drawn with Direct3D" }
      - name: Button test (the OpenGL fallback)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # OpenGL is what Snagster falls back to when Direct3D can't start. The CI machine has
          # only OpenGL 1.1, so the test copy gets Mesa's software OpenGL beside it: a pinned
          # release, checked against its published checksum. Nothing ships with Mesa.
          $mesa = "mesa3d-26.2.6-release-mingw.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/$mesa" -OutFile $mesa
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash -ne "DA0F71D9181B672C1918F3C342F11118C687F6059A46B16502845160733CC388") { throw "Mesa checksum differs" }
          7z x $mesa -omesa -y | Out-Null
          New-Item -ItemType Directory -Force uitest | Out-Null
          Copy-Item target/release/snagster.exe uitest/
          $gl = Get-ChildItem mesa -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -notmatch 'x86' } | Select-Object -First 1
          if (-not $gl) {
            Get-ChildItem mesa -Recurse -Filter *.dll | ForEach-Object { $_.FullName }
            throw "Mesa's opengl32.dll is missing"
          }
          Write-Host "OpenGL from $($gl.DirectoryName)"
          Copy-Item "$($gl.DirectoryName)/*.dll" uitest/
          Get-ChildItem uitest | Format-Table Name, Length
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:SNAGSTER_RENDERER = "opengl"
          # The release build is a windowed program: wait for it and collect what it prints.
          Start-Process uitest/snagster.exe -ArgumentList '--ui-test' -Wait -NoNewWindow -RedirectStandardOutput ui-test.txt
          Get-Content ui-test.txt
          if (-not (Select-String -Path ui-test.txt -Pattern '^(\d+) of \1 button actions worked' -Quiet)) { exit 1 }
          if (-not (Select-String -Path ui-test.txt -Pattern '^Drawn with OpenGL' -Quiet)) { throw "the window wasn't drawn with OpenGL" }
      - name: Stream test (the screen into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        shell: pwsh
        run: |
          Start-Process target/release/snagster.exe -ArgumentList '--stream-test','quick' -Wait -NoNewWindow -RedirectStandardOutput stream-test.txt
          Get-Content stream-test.txt
          if (-not (Select-String -Path stream-test.txt -Pattern '^stream test: all passed' -Quiet)) { exit 1 }
      - name: Snagster.exe for both downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Snagster | Out-Null
          Copy-Item target/release/snagster.exe dist/Snagster/Snagster.exe
      - name: Log in to Azure (for signing)
        if: env.SIGNED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Snagster.exe
        if: env.SIGNED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: dist/Snagster
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # The MCP Registry lists Snagster with one MCP bundle per system (packaging/mcpb).
      - name: Package (MCP bundle)
        shell: pwsh
        run: |
          node packaging/mcpb/make-mcpb.js bundle --exe dist/Snagster/Snagster.exe --os windows --out dist/Snagster-mcp-windows-x64.mcpb
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item dist/Snagster-mcp-windows-x64.mcpb dist/mcpb-check.zip
          Expand-Archive dist/mcpb-check.zip dist/mcpb-check
          # The release build is a windowed program: wait for it and read what it wrote.
          Start-Process dist/mcpb-check/server/Snagster.exe -ArgumentList 'help' -Wait -NoNewWindow -RedirectStandardOutput dist/mcpb-help.txt
          $out = Get-Content dist/mcpb-help.txt -TotalCount 1
          Write-Output $out
          Remove-Item dist/mcpb-help.txt
          if ("$out" -notmatch '^Snagster ') { exit 1 }
          Remove-Item -Recurse -Force dist/mcpb-check, dist/mcpb-check.zip
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $dir = "dist/Snagster"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath dist/Snagster-windows-x64-portable.zip
      - name: Package (MSIX installer)
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          if ($env:SIGNED -eq 'true') {
            # Signed in the next step; the publisher must be the certificate's subject exactly.
            if (-not $env:MSIX_PUBLISHER) { throw "Set the repository variable MSIX_PUBLISHER to the certificate profile's subject" }
            pwsh packaging/msix/make-msix.ps1 -Exe dist/Snagster/Snagster.exe -Out dist/msix/Snagster-windows-x64.msix -Publisher $env:MSIX_PUBLISHER
          } else {
            pwsh packaging/msix/make-msix.ps1 -Exe dist/Snagster/Snagster.exe -Out dist/msix/Snagster-windows-x64.msix -TestCert dist/msix/Snagster-test-signing.cer
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sign the MSIX
        if: env.SIGNED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: dist/msix
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install the MSIX and run it
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Install it the way a person would (the runner is an administrator, so the test
          # certificate can be trusted for this machine), then run the installed copy through
          # its command-line alias: the button test, then the MCP smoke test.
          if (Test-Path dist/msix/Snagster-test-signing.cer) {
            Import-Certificate -FilePath dist/msix/Snagster-test-signing.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          }
          Add-AppxPackage -Path dist/msix/Snagster-windows-x64.msix
          $pkg = Get-AppxPackage -Name SoloSaftis.Snagster
          $pkg | Format-List Name, Version, InstallLocation, SignatureKind
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\snagster.exe"
          if (-not (Test-Path $alias)) { throw "the snagster.exe alias wasn't made" }
          Start-Process $alias -ArgumentList '--ui-test' -Wait -NoNewWindow -RedirectStandardOutput ui-test-msix.txt
          Get-Content ui-test-msix.txt
          if (-not (Select-String -Path ui-test-msix.txt -Pattern '^(\d+) of \1 button actions worked' -Quiet)) { exit 1 }
          node tests/mcp-smoke.js $alias
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-AppxPackage -Package $pkg.PackageFullName
      - name: Package (Microsoft Store upload, unsigned)
        shell: pwsh
        env:
          # From Partner Center > Snagster > Product identity (packaging/msix/STORE.md). Without
          # them the package is still made with stand-in values, so the step is always tested.
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $name = if ($env:STORE_IDENTITY_NAME) { $env:STORE_IDENTITY_NAME } else { "00000Example.Snagster" }
          $pub = if ($env:STORE_PUBLISHER) { $env:STORE_PUBLISHER } else { "CN=00000000-0000-0000-0000-000000000000" }
          $shown = if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $env:STORE_PUBLISHER_DISPLAY_NAME } else { "Example" }
          # The Store signs what it publishes, so this one is uploaded unsigned.
          pwsh packaging/msix/make-msix.ps1 -Exe dist/Snagster/Snagster.exe -Out dist/store/Snagster-windows-x64-store.msix -IdentityName $name -Publisher $pub -PublisherDisplayName $shown
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Snagster-windows-x64-portable.zip
            dist/Snagster-mcp-windows-x64.mcpb
            ${{ env.SIGNED == 'true' && 'dist/msix/Snagster-windows-x64.msix' || '' }}
      # For uploading to Partner Center by hand (never on GitHub's release page).
      - uses: actions/upload-artifact@v4
        if: vars.STORE_IDENTITY_NAME != ''
        with:
          name: windows-store
          path: dist/store/Snagster-windows-x64-store.msix
      # Until signing is set up: the test-signed package and its certificate, for trying it by
      # hand (not released).
      - uses: actions/upload-artifact@v4
        if: env.SIGNED != 'true'
        with:
          name: windows-msix-test
          path: |
            dist/msix/Snagster-windows-x64.msix
            dist/msix/Snagster-test-signing.cer

  linux:
    # Built on Ubuntu 24.04, so the download runs on every Linux with glibc 2.39 or newer (Ubuntu
    # 24.04+, Debian 13, Fedora 40+, RHEL 10). 22.04 is too old for the PipeWire headers the screen
    # share needs. ubuntu-latest (26.04, glibc 2.43)
    # made a program that wouldn't start on Ubuntu 24.04 or Debian.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A new cache since NASM is installed: OpenH264 built without its assembly isn't reused.
          prefix-key: v1-nasm
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libdbus-1-dev libfuse2 \
            libva2 libva-drm2 \
            nasm
      - name: Build
        run: cargo build --release --locked
      - name: The program runs on glibc 2.39 (Ubuntu 24.04) and newer
        run: |
          need=$(objdump -T target/release/snagster | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol needed: $need"
          [ "$(printf '%s\nGLIBC_2.39\n' "$need" | sort -V | tail -1)" = GLIBC_2.39 ]
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster
      - name: Button test on a virtual screen (every button must work on Linux too)
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/snagster --ui-test | tee ui-test.txt
          grep -qE "^([0-9]+) of \1 button actions worked" ui-test.txt
      - name: Stream test on the virtual screen (into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/snagster --stream-test quick | tee stream-test.txt
          grep -q "^stream test: all passed" stream-test.txt
      - name: Portal test (screenshot and recording through real desktop portals on a headless sway)
        # Being brought up: Ubuntu's sway portal has no Screenshot interface, and its headless
        # screen copy refuses the pixman renderer's format. Shown in the log, not yet required.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          sudo apt-get install -y --no-install-recommends sway xdg-desktop-portal xdg-desktop-portal-wlr pipewire wireplumber dbus dbus-user-session
          dbus-run-session -- sh tests/portal-test.sh target/release/snagster
      - name: Package (AppImage and portable tar.gz)
        run: |
          set -euo pipefail
          stage=dist/Snagster
          mkdir -p "$stage"
          cp target/release/snagster "$stage/Snagster"
          cp assets/snagster-256.png "$stage/snagster.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          # The menu entry from assets/linux, with this package's program and icon names.
          sed -e 's/^Exec=snagster/Exec=Snagster/' -e 's/^Icon=.*/Icon=snagster/' \
            assets/linux/io.github.SoloSaftis.Snagster.desktop > "$stage/snagster.desktop"
          tar -C dist -czf dist/Snagster-linux-x86_64-portable.tar.gz Snagster
          appdir=dist/Snagster.AppDir
          mkdir -p "$appdir/usr/bin"
          cp target/release/snagster "$appdir/usr/bin/Snagster"
          cp assets/snagster-256.png "$appdir/snagster.png"
          cp "$stage/snagster.desktop" "$appdir/snagster.desktop"
          printf '#!/bin/sh\nhere="$(dirname "$(readlink -f "$0")")"\nexec "$here/usr/bin/Snagster" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          # appimagetool, pinned to a release and checked against its published checksum.
          tool=dist/appimagetool
          curl -fsSL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --no-appstream "$appdir" dist/Snagster-linux-x86_64.AppImage
      - name: Package (MCP bundle)
        run: |
          set -euo pipefail
          node packaging/mcpb/make-mcpb.js bundle --exe target/release/snagster --os linux --out dist/Snagster-mcp-linux-x86_64.mcpb
          mkdir -p /tmp/mcpb && unzip -q dist/Snagster-mcp-linux-x86_64.mcpb -d /tmp/mcpb
          test -x /tmp/mcpb/server/snagster
          /tmp/mcpb/server/snagster help | sed -n 1p | grep '^Snagster '
      - name: The packaged AppImage and tar.gz start
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Snagster-linux-x86_64.AppImage help | sed -n 1,5p
          mkdir -p /tmp/tgz && tar -C /tmp/tgz -xzf dist/Snagster-linux-x86_64-portable.tar.gz
          /tmp/tgz/Snagster/Snagster help | sed -n 1,5p
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Snagster-linux-x86_64.AppImage
            dist/Snagster-linux-x86_64-portable.tar.gz
            dist/Snagster-mcp-linux-x86_64.mcpb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP smoke test (stdio and HTTP, no screen needed)
        run: node tests/mcp-smoke.js target/release/snagster
      - name: Button test (every button in the real window; the runner has a logged-in desktop)
        timeout-minutes: 10
        run: |
          ./target/release/snagster --ui-test | tee ui-test.txt
          grep -qE "^([0-9]+) of \1 button actions worked" ui-test.txt
      # Apple silicon: OpenH264 uses its NEON assembly, so no NASM. Without the screen-recording
      # permission the test streams a moving test picture instead of the screen.
      - name: Stream test (into Snagster's own RTMP server on 127.0.0.1)
        timeout-minutes: 5
        run: |
          set -o pipefail
          ./target/release/snagster --stream-test quick | tee stream-test.txt
          grep -q "^stream test: all passed" stream-test.txt
      - name: Package (app in a zip)
        run: |
          set -euo pipefail
          app=dist/Snagster.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/snagster "$app/MacOS/snagster"
          iconset=dist/snagster.iconset
          mkdir -p "$iconset"
          for s in 16 32 64 128 256; do sips -z $s $s assets/snagster-256.png --out "$iconset/icon_${s}x${s}.png" >/dev/null; done
          cp "$iconset/icon_32x32.png" "$iconset/icon_16x16@2x.png"
          cp "$iconset/icon_64x64.png" "$iconset/icon_32x32@2x.png"
          cp "$iconset/icon_256x256.png" "$iconset/icon_128x128@2x.png"
          rm "$iconset/icon_64x64.png"
          iconutil -c icns "$iconset" -o "$app/Resources/Snagster.icns"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Snagster</string>
            <key>CFBundleDisplayName</key><string>Snagster</string>
            <key>CFBundleIdentifier</key><string>app.snagster</string>
            <key>CFBundleExecutable</key><string>snagster</string>
            <key>CFBundleIconFile</key><string>Snagster</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.3</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSScreenCaptureUsageDescription</key><string>Snagster takes screenshots of what you choose.</string>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - dist/Snagster.app
          (cd dist && ditto -c -k --keepParent Snagster.app Snagster-macos-arm64.zip)
      - name: Package (MCP bundle)
        run: |
          set -euo pipefail
          node packaging/mcpb/make-mcpb.js bundle --exe target/release/snagster --os macos --out dist/Snagster-mcp-macos-arm64.mcpb
          mkdir -p /tmp/mcpb && unzip -q dist/Snagster-mcp-macos-arm64.mcpb -d /tmp/mcpb
          test -x /tmp/mcpb/server/snagster
          /tmp/mcpb/server/snagster help | sed -n 1p | grep '^Snagster '
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Snagster-macos-arm64.zip
            dist/Snagster-mcp-macos-arm64.mcpb

  # Snagster's own Flatpak (packaging/flatpak, AI-generated and not the Flathub manifest), built
  # in Flathub's build image and attached to releases as Snagster-linux-x86_64.flatpak.
  flatpak-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Crates for the offline build (flatpak-cargo-generator, pinned)
        run: |
          python3 -m venv /tmp/fcg
          /tmp/fcg/bin/pip install -q tomlkit aiohttp
          curl -fsSLo /tmp/fcg.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          /tmp/fcg/bin/python /tmp/fcg.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: cargo-sources.json

  # flatpak-builder straight on the runner: Flathub's build container failed to update its
  # preinstalled SDK ("Invalid cross-device link").
  flatpak:
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - name: Flatpak and flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo --default-branch=stable build packaging/flatpak/io.github.SoloSaftis.Snagster.yml
          flatpak build-bundle repo Snagster-linux-x86_64.flatpak io.github.SoloSaftis.Snagster stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -l Snagster-linux-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Snagster-linux-x86_64.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows, linux, macos, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: '{windows,linux,macos,flatpak}'
      # The updater (src/update.rs) installs a download only when its SHA-256 matches this file.
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          ls -l
          # The five downloads and three MCP bundles, and the MSIX once it is signed with a real certificate.
          n=$(ls | wc -l); test "$n" -eq 8 -o "$n" -eq 9
          sha256sum -b -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      # The MCP Registry listing for this release: the bundles' addresses and SHA-256. The
      # maintainer publishes it with mcp-publisher.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write server.json
        run: node packaging/mcpb/make-mcpb.js server-json --dir artifacts --tag "${GITHUB_REF_NAME}" --out server-json/server.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/__TAG__/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          gh release create "${GITHUB_REF_NAME}" artifacts/* server-json/server.json --title "Snagster ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
