[package]
name = "snagster"
version = "0.10.6"
edition = "2024"
# let-chains and other newer Rust: older compilers stop with a clear message.
rust-version = "1.88"
description = "Snagster - capture your screen, mark it up, share it"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
base64 = "0.22"
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.37.0", features = ["serde"] }
epaint_default_fonts = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
gif = "0.14"
global-hotkey = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico"] }
regex = "1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
ureq = { version = "3", features = ["json"] }
# RTMPS for live streaming: the same rustls (ring) and Mozilla root certificates ureq uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# SHA-256 for checking updates against the release's SHA256SUMS: the ring rustls already
# brings (Apache-2.0 AND ISC).
ring = { version = "0.17", default-features = false }
tiny-skia = "0.12.0"
trash = "5.3.0"
# Tray icon; on Linux the pure-Rust D-Bus backend (ksni) instead of GTK.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ttf-parser = "0.25"
xcap = "0.9.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
# Software H.264 on every system (the fallback when there is no graphics-chip encoder): Cisco's
# OpenH264 built from its source (BSD-2-Clause), used through its C interface so it can encode
# in slices on several threads. Its x86 assembly is built where `nasm` is installed (CI installs
# it), else plain C.
openh264-sys2 = "0.9"

[dev-dependencies]
# OpenH264's decoder, to check in the tests that what was encoded decodes back.
openh264 = "0.9"

[profile.dev]
# Snag's own code is optimised too, so everyday builds run fast.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# The build to hand out: whole-program optimisation, one code unit, no debug symbols.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_Storage_Packaging_Appx", "Win32_UI_Accessibility"] }
windows = { version = "0.62", features = ["ApplicationModel", "Win32_UI_WindowsAndMessaging", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Media_Audio", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Accessibility", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_UI_Shell"] }

# Windows draws the window with Direct3D 12 through wgpu (OpenGL stays as the fallback): the
# OpenGL drivers on company laptops are often old, and remote desktops and VDI sessions have only
# OpenGL 1.1, while Direct3D 12 always works (Microsoft's WARP software renderer at worst).
# Only the DX12 backend and WGSL shaders, so no Vulkan, Metal or GLES code is built.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["std", "dx12", "wgsl"] }
# The graphics chips Direct3D offers, for --hw-report (already in the tree through eframe).
pollster = "1"

# The window handle eframe hands over, for Windows 11's round corners on the frameless panel
# (MIT/Apache-2.0/Zlib; already in the tree through winit).
raw-window-handle = "0.6"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# Video files on Linux and macOS: an MP4 writer.
[target."cfg(not(windows))".dependencies]
mp4 = "0.14"

# VA-API (graphics-chip video encoding) is loaded while running, so Snagster still starts where
# libva isn't installed.
[target."cfg(target_os = \"linux\")".dependencies]
libloading = "0.8"
# Bringing the minimized window back after a recording on Wayland (xdg-activation over winit's own
# connection). Already in the tree through winit (MIT); raw-window-handle (MIT/Apache-2.0/Zlib)
# through eframe.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
raw-window-handle = "0.6"
# Live-stream screen copies on X11: one connection kept open and MIT-SHM shared memory
# (MIT/Apache-2.0; already in the tree for the window and the clipboard). libc for the System V
# shared-memory segment (MIT/Apache-2.0).
x11rb = { version = "0.13", features = ["shm"] }
libc = "0.2"
# The desktop's portals (Screenshot, ScreenCast, Trash in the Flatpak) and PipeWire for the screen share: how Snagster
# sees the screen on Wayland and inside a Flatpak. The same versions and features xcap already
# brings (ashpd MIT, pipewire MIT, pollster Apache-2.0/MIT), so nothing new in the tree.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "notification", "pipewire", "screencast", "screenshot", "settings", "trash", "open_uri"] }
# Global hotkeys on Wayland (the GlobalShortcuts portal): waiting for a key and a timer at once.
# Both already in the tree through ashpd and zbus (MIT/Apache-2.0).
futures-util = { version = "0.3", default-features = false }
async-io = "2"
pipewire = "0.10"
pollster = "1"
# The Adwaita-style title bar winit draws on GNOME under Wayland (GNOME has no server-side
# title bars; without this winit draws a plain grey fallback). sctk-adwaita is MIT, its
# tiny-skia BSD-3-Clause, ab_glyph Apache-2.0 (already here).
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target."cfg(target_os = \"macos\")".dependencies]
winit = "0.30"
# The live-stream key in the login Keychain (MIT/Apache-2.0).
security-framework = "3"
# Increase contrast and the accent colour (MIT; already in the tree through winit, tray-icon).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace", "NSColor", "NSColorSpace", "objc2-core-foundation"] }

# egui 0.37 with right-to-left text (Arabic, Hebrew, Persian, Urdu), fallback-font alignment for
# CJK and Indian scripts, and shortcuts on non-Latin keyboards: the same patched egui CVBuilder uses.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
